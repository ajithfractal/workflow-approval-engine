###############################################################################
# Workflow Engine - Standalone Microservice Mode Configuration
###############################################################################
#
# This configuration is used when running the workflow engine as a standalone
# microservice. Override these values using environment variables or
# application.yml in your deployment.
#
###############################################################################

# Application Name
spring.application.name=workflow-engine

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workflow_db}
spring.datasource.username=${DB_USERNAME:workflow_user}
spring.datasource.password=${DB_PASSWORD:workflow_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Spring State Machine
spring.statemachine.enabled=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging Configuration
logging.level.com.fractalhive.workflowcore=INFO
logging.level.org.springframework.statemachine=${STATEMACHINE_LOG_LEVEL:WARN}

# Multi-tenancy Configuration
# Schema routing is handled by TenantFilter and SchemaRoutingDataSource
# Keycloak integration is handled by external dependency

###############################################################################
# Environment Variables Reference
###############################################################################
#
# DB_HOST - Database host (default: localhost)
# DB_PORT - Database port (default: 5432)
# DB_NAME - Database name (default: workflow_db)
# DB_USERNAME - Database username (default: workflow_user)
# DB_PASSWORD - Database password (default: workflow_pass)
# SERVER_PORT - Server port (default: 8080)
# DDL_AUTO - Hibernate DDL mode (default: update)
# SHOW_SQL - Show SQL queries (default: false)
# FORMAT_SQL - Format SQL queries (default: false)
# STATEMACHINE_LOG_LEVEL - State machine log level (default: WARN)
#
###############################################################################
