###############################################################################
# Workflow Engine - Standalone Microservice Mode Configuration
###############################################################################
#
# This configuration is used when running the workflow engine as a standalone
# microservice. Override these values using environment variables or
# application.yml in your deployment.
#
###############################################################################

# Application Name
spring.application.name=workflow-engine

# Server Configuration
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://192.168.0.115:5432/wf
spring.datasource.username=appuser
spring.datasource.password=fractal@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Spring State Machine
spring.statemachine.enabled=true

# Swagger/OpenAPI Configuration
# Use default SpringDoc paths (/v3/api-docs) for better compatibility
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Note: By NOT specifying springdoc.packages-to-scan, SpringDoc will scan ALL registered @RestController classes
# This ensures Keycloak APIs are included regardless of their package structure

# Logging Configuration
logging.level.com.fractalhive.workflowcore=INFO
logging.level.org.springframework.statemachine=${STATEMACHINE_LOG_LEVEL:WARN}
# Debug logging for SpringDoc to see what packages/controllers are being scanned
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
# Log all registered request mappings to see what controllers are available
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# Multi-tenancy Configuration
# Schema routing is handled by TenantFilter and SchemaRoutingDataSource
# Keycloak integration is handled by external dependency

###############################################################################
# Environment Variables Reference
###############################################################################
#
# DB_HOST - Database host (default: localhost)
# DB_PORT - Database port (default: 5432)
# DB_NAME - Database name (default: workflow_db)
# DB_USERNAME - Database username (default: workflow_user)
# DB_PASSWORD - Database password (default: workflow_pass)
# SERVER_PORT - Server port (default: 8080)
# DDL_AUTO - Hibernate DDL mode (default: update)
# SHOW_SQL - Show SQL queries (default: false)
# FORMAT_SQL - Format SQL queries (default: false)
# STATEMACHINE_LOG_LEVEL - State machine log level (default: WARN)
#
###############################################################################



